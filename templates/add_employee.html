{% extends "base.html" %}{% block content %}<section class="formbox"><div class="eyebrow">HR • EMPLOYEE MANAGEMENT</div><h1>Add Employee</h1><p class="muted">Employee data will belong to your HR account and company.</p><form method="post" class="grid"><label>Employee ID<input name="employee_id" required></label><label>Name<input name="name" required></label><label>Age<input type="number" step=".1" name="age" required></label><label>Years Experience<input type="number" step=".1" name="years_experience" required></label><label>Department<input name="department" required></label><label>Job Role<input name="job_role" required></label><div><button>Save Employee</button> <a class="small gray" href="{{url_for('hr_dashboard')}}">Cancel</a></div></form></section>{% endblock %}

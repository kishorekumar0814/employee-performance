{% extends "base.html" %}{% block content %}<div class="auth-layout"><div class="auth-visual"><div><small>COMPANY ONBOARDING</small><h2>Build a private workforce workspace.</h2><p>Each company has one Admin and can have multiple HR accounts.</p></div></div><section class="auth-card"><div class="auth-brand">WM<span>•</span></div><h1>Create account</h1><p class="muted">Join an existing company or create a new workspace.</p><form method="post"><label>Company Name<input name="company_name" placeholder="e.g. Nila Company" required></label><label>User ID<input name="username" placeholder="Choose User ID" required></label><label>Password<input type="password" name="password" placeholder="Create password" required></label><label>Role<select name="role" required><option value="">Select role</option><option value="hr">HR</option><option value="admin">Admin</option></select></label><button class="full">Create Account</button></form><p class="auth-foot">Already registered? <a href="{{url_for('login')}}">Sign in</a></p></section></div>{% endblock %}
